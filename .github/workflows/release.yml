name: Build installers
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml', 'scripts/**', 'package.json', 'desktop/**', 'shared/**', 'extension/**']
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create (e.g. v0.1.0)
        default: v0.1.0

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Build .dmg (Apple Silicon + Intel)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
      - name: Verify the app is at least ad-hoc signed (required on Apple Silicon)
        run: |
          for app in dist/mac-arm64/SyncWatch.app dist/mac/SyncWatch.app; do
            [ -d "$app" ] || continue
            codesign --verify --deep --strict "$app"
            codesign -dv "$app" 2>&1 | head -4
          done
      - name: Zip the Chrome extension
        run: node scripts/build-extension.js && (cd extension && zip -rq ../dist/SyncWatch-chrome-extension.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: SyncWatch-mac, path: 'dist/*.dmg' }
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SyncWatch-chrome-extension.zip
          tag_name: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0' }}
          name: SyncWatch ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v0.1.0' }}
          body: |
            **Chrome extension** (works on any site, keeps your own ad blocker): download `SyncWatch-chrome-extension.zip`, unzip it, open chrome://extensions, turn on Developer mode, click Load unpacked and pick the unzipped folder.

            Mac installers: **arm64** = Apple Silicon (M1/M2/M3/M4), **x64** = Intel. Unsigned: right-click the app and choose Open the first time.
