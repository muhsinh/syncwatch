name: Build installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: Build .dmg (Apple Silicon + Intel)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
      - name: Verify the app is at least ad-hoc signed (required on Apple Silicon)
        run: |
          for app in dist/mac-arm64/SyncWatch.app dist/mac/SyncWatch.app; do
            [ -d "$app" ] && codesign --verify --deep --strict "$app" && codesign -dv "$app" 2>&1 | head -3
          done
      - uses: actions/upload-artifact@v4
        with: { name: SyncWatch-mac, path: dist/*.dmg }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.dmg }
